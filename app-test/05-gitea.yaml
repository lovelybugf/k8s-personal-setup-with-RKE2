apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: dev-gitea
  labels:
    app: gitea
    component: server
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
    - port: 2222
      targetPort: 22
      name: ssh
  selector:
    app: gitea
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: dev-gitea
  labels:
    app: gitea
    component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      nodeSelector:
        kubernetes.io/hostname: node-172-25-250-20
      
      # Init Container để chown thư mục hostPath sang UID 1000 (user git của Gitea)
      initContainers:
        - name: init-gitea-permissions
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          securityContext:
            runAsUser: 0 # Chạy quyền root để đổi quyền sở hữu thư mục
          volumeMounts:
            - name: gitea-data
              mountPath: /data
      
      containers:
        - name: gitea
          image: gitea/gitea:1.21
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          env:
            # Loại database
            - name: GITEA__database__DB_TYPE
              value: postgres
            # Host Database
            - name: GITEA__database__HOST
              value: "db:5432"
            # Tên database
            - name: GITEA__database__NAME
              valueFrom:
                configMapKeyRef:
                  name: app-configmap
                  key: DB_NAME
            # User DB
            - name: GITEA__database__USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER
            # Mật khẩu DB
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            
            # Cấu hình khóa trang cài đặt (đi thẳng vào Login/Register)
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            # Cấu hình cho phép người dùng tự Đăng ký tài khoản
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "false"
            
            # URL truy cập của Web UI (cho Ingress sslip.io)
            - name: GITEA__server__ROOT_URL
              value: "http://gitea.10.1.71.250.sslip.io/"
            - name: GITEA__server__DOMAIN
              value: "gitea.10.1.71.250.sslip.io"
            - name: GITEA__server__SSH_DOMAIN
              value: "10.1.71.250"
            - name: GITEA__server__SSH_PORT
              value: "2222"
          
          volumeMounts:
            - name: gitea-data
              mountPath: /data
          
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
      
      volumes:
        - name: gitea-data
          hostPath:
            path: /var/gitea-data
            type: DirectoryOrCreate
